<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PC Parts Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

    <main class="login-card">
        <a class="brand login-brand" href="index.html">
            <span class="brand-mark">PC</span>
            <span>PARTS<span class="brand-accent">STORE</span></span>
        </a>

        <p class="eyebrow">SELAMAT DATANG KEMBALI</p>
        <h1>Masuk ke akunmu</h1>
        <p class="muted">Temukan komponen PC favoritmu.</p>

        <form action="index.html" method="get">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Masukkan username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Masukkan password"
                required
            >

            <button
                class="button button-primary login-button"
                type="submit">
                Masuk →
            </button>
        </form>

        <p class="login-note">
            Demo tampilan login.
        </p>

        <a class="back-link" href="index.html">
            Lihat toko tanpa login
        </a>
    </main>

</body>
</html>
